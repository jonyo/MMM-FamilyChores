<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Family Chores Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Family Chores Admin</h1>
      <div class="backup-section">
        <button id="backupBtn" type="button" class="btn btn-secondary">Download Backup</button>
        <label for="restoreFile" class="btn btn-secondary">Restore Backup</label>
        <input type="file" id="restoreFile" accept=".json" hidden>
      </div>
    </header>

    <main>
      <!-- People Section -->
      <section class="section">
        <div class="section-header">
          <h2>People</h2>
          <div class="button-with-tooltip">
            <button id="addPersonBtn" type="button" class="btn btn-primary">Add Person</button>
            <span id="addPersonInfo" class="info-icon" data-tooltip="Add at least one person before you can create chores" style="display: none;">ℹ️</span>
          </div>
        </div>
        <div id="peopleList" class="item-list"></div>
      </section>

      <!-- Rotating Chores Section -->
      <section class="section" id="rotatingChoresSection" style="display: none;">
        <div class="section-header">
          <h2>Rotating Chores</h2>
          <button id="addRotatingChoreBtn" type="button" class="btn btn-primary">Add Rotating Chore</button>
        </div>
        <div id="rotatingChoresList" class="item-list"></div>
      </section>

      <!-- System State Section -->
      <section class="section">
        <h2>System State</h2>
        <div class="state-info">
          <p><strong>Last Reset Date:</strong> <span id="lastResetDate">-</span></p>
          <div class="button-with-tooltip">
            <button id="resetDailyBtn" type="button" class="btn btn-warning">Force Daily Reset</button>
            <span class="info-icon" data-tooltip="WARNING: This will un-check all chores and rotate assignment on rotating chores to the next person. It does respect skip days if today is a skip day. Useful for testing or immediately advancing chore assignments.">ℹ️</span>
          </div>
        </div>
      </section>
    </main>

    <!-- Modals -->
    <div id="personModal" class="modal">
      <div class="modal-content">
        <h3 id="personModalTitle">Add Person</h3>
        <form id="personForm">
          <input type="hidden" id="personId">
          <div class="form-group">
            <label for="personName">Name:</label>
            <input type="text" id="personName" required>
          </div>
          <div class="form-group">
            <label for="personColor">Color:</label>
            <div class="color-input-group">
              <input type="color" id="personColor" value="#FF6B6B" required>
              <button type="button" id="randomizeColorBtn" class="btn btn-secondary btn-sm">Randomize</button>
            </div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" class="btn btn-secondary cancel-btn">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <div id="choreModal" class="modal">
      <div class="modal-content">
        <h3 id="choreModalTitle">Add Chore</h3>
        <form id="choreForm">
          <input type="hidden" id="choreId">
          <input type="hidden" id="choreType">
          <div class="form-group">
            <label for="choreName">Name:</label>
            <input type="text" id="choreName" required>
          </div>
          <div class="form-group" id="assignedToGroup">
            <label for="assignedTo">Assigned To:</label>
            <select id="assignedTo"></select>
          </div>
          <div class="form-group" id="rotationGroup" style="display: none;">
            <label>Rotation:</label>
            <div id="rotationList" class="checkbox-list"></div>
          </div>
          <div class="form-group">
            <label for="choreDeadline">Deadline (optional):</label>
            <input type="time" id="choreDeadline">
          </div>
          <div class="form-group">
            <label>Skip Days:</label>
            <div class="checkbox-list">
              <label><input type="checkbox" value="sunday" class="skipDay"> Sunday</label>
              <label><input type="checkbox" value="monday" class="skipDay"> Monday</label>
              <label><input type="checkbox" value="tuesday" class="skipDay"> Tuesday</label>
              <label><input type="checkbox" value="wednesday" class="skipDay"> Wednesday</label>
              <label><input type="checkbox" value="thursday" class="skipDay"> Thursday</label>
              <label><input type="checkbox" value="friday" class="skipDay"> Friday</label>
              <label><input type="checkbox" value="saturday" class="skipDay"> Saturday</label>
            </div>
          </div>
          <div class="form-group">
            <label for="skipDayVisibility">Skip Day Visibility:</label>
            <select id="skipDayVisibility">
              <option value="show_if_overdue">Show if Overdue</option>
              <option value="show_always">Show Always</option>
              <option value="hide">Hide</option>
            </select>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save</button>
            <button type="button" class="btn btn-secondary cancel-btn">Cancel</button>
          </div>
        </form>
      </div>
    </div>

    <div id="copyModal" class="modal">
      <div class="modal-content">
        <h3>Copy Chores</h3>
        <form id="copyForm">
          <input type="hidden" id="copyFromPersonId">
          <div class="form-group">
            <label>From:</label>
            <p id="copyFromPersonName" style="font-weight: bold;"></p>
          </div>
          <div class="form-group">
            <label for="copyToPersonId">To:</label>
            <select id="copyToPersonId" required></select>
          </div>
          <div class="form-group">
            <label>Chores to copy:</label>
            <div id="copyChoresList" class="checkbox-list"></div>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Copy</button>
            <button type="button" class="btn btn-secondary cancel-btn">Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
